[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ANYstability"
version = "0.1.0.dev0"
description = "Standalone ship stability foundations with explicit geometry admission"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MPL-2.0"}
authors = [{name = "Audun Nyhus"}]
dependencies = []

[project.scripts]
anystability = "anystability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anystability = ["py.typed"]
