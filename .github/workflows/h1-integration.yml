name: Installed H1 development integration
on:
  push:
    branches: [work/s2-owner-h1]
permissions:
  contents: read
jobs:
  owner-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build and inspect pinned owner artifact
        env:
          ANYGEOMETRY_BUILD_NATIVE: '0'
          ANYGEOMETRY_REQUIRE_NATIVE: '0'
          ANYGEOMETRY_DISABLE_NATIVE: '1'
        run: python tools/verify_h1_owner.py
