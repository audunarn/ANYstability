name: Installed foundation tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, inspected 2026-10-15
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, inspected 2026-10-15
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install built artifact, without runtime dependencies
        run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','--no-deps',glob.glob('dist/*.whl')[0]])"
      - name: Test installed package
        run: python -I -m unittest discover -s tests -v
      - name: Confirm tests did not modify source
        run: git diff --exit-code
